[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almanac-bench"
version = "0.1.0"
description = "A benchmark for what an agent's memory knows about its own knowledge: time, plans, provenance, absence, tasks and hygiene."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joey Payton" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jbpayton/almanac"

[tool.setuptools.packages.find]
include = ["almanac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
