name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: The committed test set is exactly what the generator produces
        run: |
          python -m almanac.generate --lives 8 --seed 1 --out /tmp/lives
          diff -r /tmp/lives data/lives
